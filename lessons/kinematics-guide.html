<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Robotics: Forward and Inverse Kinematics</title>
<style>
:root{
  --bg:#eceff3; --card:#fff; --ink:#1d2433; --muted:#5d677a; --line:#e3e7ee;
  --shadow:0 10px 32px rgba(24,36,60,.09), 0 2px 6px rgba(24,36,60,.05);
  --ok:#15803d; --okbg:#ecfdf3; --bad:#b91c1c; --badbg:#fef2f2; --accent:#4f46e5;
  --r:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:14px 12px 120px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 28px}
h1{font-size:clamp(1.55rem,4.6vw,2.2rem);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.45rem;line-height:1.25;margin:.1rem 0 .6rem}
h3{font-size:1.02rem;margin:1.2rem 0 .4rem}
p{margin:.6rem 0}
.lede{color:var(--muted);margin:0;font-size:1.04rem}
.small{font-size:.9rem;color:var(--muted)}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}

/* step map */
.mapcard{padding:16px 10px 12px}
.prog{display:flex;align-items:center;gap:10px;padding:0 14px 10px;color:var(--muted);font-size:.85rem}
.prog .bar{flex:1;height:8px;background:#e8ecf2;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0f766e,#2563eb,#c2410c,#7c3aed);border-radius:99px;transition:width .35s}
.mapscroll{overflow-x:auto;padding:4px 10px 8px;-webkit-overflow-scrolling:touch}
.map{display:flex;align-items:flex-start;min-width:max-content}
.grp{display:flex;flex-direction:column;align-items:flex-start}
.glabel{height:22px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);padding-left:4px;white-space:nowrap}
.nodes{display:flex;align-items:flex-start}
.con{display:block;width:20px;height:3px;background:#d5dbe5;border-radius:3px;margin-top:19px;flex:none}
.gcon{display:block;width:26px;height:3px;background:#d5dbe5;border-radius:3px;margin-top:42px;flex:none}
.node{background:none;border:0;padding:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);text-align:center;flex:none}
.badge{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;display:grid;place-items:center;position:relative;font-size:1rem;transition:box-shadow .2s}
.node.cur .badge{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c)}
.node .tick{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:.72rem;display:none;place-items:center;border:2px solid #fff}
.node.done .tick{display:grid}
.nlabel{font-size:.74rem;line-height:1.2;color:var(--muted);max-width:90px;min-height:2.4em}
.node.cur .nlabel{color:var(--ink);font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:#d5dbe5}
.dots i.on{background:var(--c)}

/* step header and learn page */
.stephead{display:flex;align-items:center;gap:12px;margin-bottom:.6rem}
.stephead .badge{width:44px;height:44px;flex:none}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.stephead h2{margin:0}
.big{background:color-mix(in srgb,var(--c) 9%,#fff);border-left:5px solid var(--c);border-radius:16px;padding:14px 18px;margin:1rem 0;font-weight:600}
.pic{background:#f6f7fa;border-radius:16px;padding:14px 18px;margin:1rem 0}
.pic b.lbl,.ex b.lbl{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.15rem}
.ex{border:2px solid color-mix(in srgb,var(--c) 40%,#fff);border-radius:18px;padding:14px 18px;margin:1.2rem 0}
.ex ul,.ex ol{margin:.4rem 0 .4rem 1.1rem;padding:0}
.rem{background:#111827;color:#fff;border-radius:16px;padding:12px 18px;margin:1.2rem 0 .2rem;font-weight:600}
.rem span{color:#fcd34d;margin-right:.4rem}
.eq{background:#f3f5f9;border-radius:14px;padding:12px 16px;margin:.8rem 0;font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.08rem;text-align:center;line-height:1.7;overflow-x:auto}
.eq.small{font-size:.98rem}
.terms{padding-left:1.2rem;margin:.5rem 0}
.terms li{margin:.3rem 0}
.try{background:#fffbeb;border-radius:14px;padding:10px 14px;font-size:.95rem}
.spaces{display:flex;align-items:stretch;gap:10px;margin:1rem 0;flex-wrap:wrap}
.sp{flex:1 1 150px;background:#f3f5f9;border-radius:16px;padding:12px 14px;text-align:center}
.sp b{display:block}.sp span{font-size:.9rem;color:var(--muted)}
.arrows{display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--accent);text-align:center;flex:1 1 150px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tblwrap{overflow-x:auto}

/* viewers */
.viz{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:12px;margin:1.1rem 0}
.viz canvas{display:block;width:100%;height:auto;border-radius:14px;background:#fff;touch-action:none;cursor:grab}
.viz canvas:active{cursor:grabbing}
.controls{display:grid;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:10px;font-size:.92rem}
.row output{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #cdd5e1;border-radius:99px;padding:6px 14px;font-size:.88rem;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.readout{margin-top:10px;font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:.98rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;line-height:1.75;overflow-x:auto}
.readout b{color:var(--accent)}
.status{margin-top:10px;border-radius:14px;padding:10px 14px;font-size:.95rem;background:#eef6ff;border:1px solid #bfdbfe}
.status.bad{background:var(--badbg);border-color:#fecaca;color:#7f1d1d}
.vizcap{display:none;font-size:.82rem;color:var(--muted);margin:.4rem 0 0}

/* figures and small widgets */
.fig{margin:1.1rem 0}
.fig-svg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:20px}
.fig figcaption{font-size:.88rem;color:var(--muted);margin:.45rem .4rem 0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1rem 0}
.cardlet{background:#f6f7fa;border-radius:16px;padding:12px 14px;font-size:.95rem}
.cardlet b{display:block;font-size:1.02rem;margin-bottom:.15rem}
.cardlet.j b{color:#0f766e}.cardlet.l b{color:#2563eb}.cardlet.e b{color:#c2410c}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.98rem;line-height:1.5}
.two b{display:block;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase}
.two .js b{color:#2563eb}.two .ts b{color:#c2410c}
.two span{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:12px;background:#e8ecf2;border-radius:99px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);border-radius:99px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:99px;padding:10px 22px;font-weight:700;background:var(--accent);color:#fff}
.btn.sec{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.step-s1 .big{font-size:1.12rem}

/* quizzes */
.qnum{font-weight:700;color:var(--c)}
.q{border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin:14px 0}
.q .qt{font-weight:600;margin:0 0 .6rem}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:#9db4dd;background:#f8fbff}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 14px;font-size:.95rem}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid #bbf7d0}
.fb.no{background:var(--badbg);border:1px solid #fecaca}
.fb b{display:block;margin-bottom:2px}
.fb a{font-weight:600}
.score{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#111827;color:#fff;border-radius:18px;padding:12px 18px;margin-top:16px}
.score a{color:#fcd34d}
.results{margin-top:14px;background:#f6f7fa;border-radius:18px;padding:14px 18px}
.results ul{margin:.4rem 0 0 1.1rem;padding:0}

/* pager */
.pager{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border-radius:99px;box-shadow:0 12px 34px rgba(24,36,60,.22),0 2px 8px rgba(24,36,60,.1);display:flex;align-items:center;gap:6px;padding:7px;z-index:10;width:min(560px,calc(100vw - 24px))}
.pager button{border:0;border-radius:99px;padding:11px 20px;font-weight:700;min-width:96px}
.pager .back{background:#eef1f6;color:var(--ink)}
.pager .next{background:var(--accent);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.pager .where{flex:1;text-align:center;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* footer */
.foot{font-size:.92rem;color:var(--muted)}
.foot p{margin:.2rem 0}
.foot h2{font-size:.95rem;margin:.9rem 0 .2rem;color:var(--ink)}
.foot ul{margin:.3rem 0 0 1.1rem;padding:0}

/* print */
.print-only{display:none}
body.print{background:#fff;padding:0;font-size:10.5pt;line-height:1.45}
body.print .wrap{max-width:none;gap:0}
body.print .card{box-shadow:none;border-radius:0;border:0;padding:0 0 6mm}
body.print .pager,body.print .mapcard{display:none!important}
body.print .controls,body.print .readout.live{display:none!important}
body.print .vizcap{display:block}
body.print .viz{break-inside:avoid;border-radius:0;border:1px solid #ccd3df;max-width:130mm}
body.print .fig{break-inside:avoid;max-width:150mm}
body.print .fig-svg{border-radius:0}
body.print .cards,body.print .two{break-inside:avoid}
body.print .viz canvas{max-width:120mm}
body.print .pstep{break-before:auto;padding-top:7mm;margin-top:3mm;border-top:1.5px solid #d5dbe5}
body.print .pstep:first-of-type{border-top:0;padding-top:0}
body.print .pstep.pb{break-before:page;border-top:0;padding-top:0}
body.print h2,body.print h3,body.print .stephead,body.print .kicker{break-after:avoid}
body.print .big,body.print .pic{break-after:avoid}
body.print .q{break-inside:avoid;border-radius:0;padding:8px 12px;margin:10px 0}
body.print .ex,body.print .big,body.print .pic,body.print .rem,body.print .eq{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.print .badge,body.print .rem{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.print .opts.pl{list-style:none}
body.print .opts.pl li{display:flex;gap:8px;margin:3px 0}
body.print .opts.pl .ltr{font-weight:700;width:1.4em}
body.print .key h3{margin-top:12px}
body.print .key p{margin:.2rem 0}
body.print .rowtbl{break-inside:avoid}
body.print .hero{padding-bottom:4mm}
@page{size:A4;margin:16mm 15mm}
@media print{
  body{background:#fff;padding:0}
  .pager,.mapcard,.controls{display:none!important}
  .card{box-shadow:none;border-radius:0;padding-left:0;padding-right:0}
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .card{padding:20px 18px;--r:24px}
  .row{grid-template-columns:62px 1fr 56px}
  .pager button{min-width:80px;padding:11px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="card hero"><h1 id="title"></h1><p class="lede" id="lede"></p></header>
  <section class="card mapcard" id="mapcard" aria-label="Step map"><div class="prog"><span id="proglabel"></span><div class="bar"><i id="progbar"></i></div></div><div class="mapscroll"><div class="map" id="map"></div></div></section>
  <main id="stage"></main>
  <footer class="card foot" id="foot"></footer>
</div>
<nav class="pager" id="pager" aria-label="Page navigation"><button class="back" id="back">Back</button><span class="where" id="where"></span><button class="next" id="next">Next</button></nav>
