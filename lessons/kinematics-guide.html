.0\" x2=\"110.0\" y2=\"105.0\" stroke=\"#b98a60\" stroke-width=\"26\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"110.0\" y1=\"205.0\" x2=\"110.0\" y2=\"105.0\" stroke=\"#efc9a3\" stroke-width=\"20\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"110.0\" y1=\"105.0\" x2=\"215.0\" y2=\"105.0\" stroke=\"#b98a60\" stroke-width=\"26\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"110.0\" y1=\"105.0\" x2=\"215.0\" y2=\"105.0\" stroke=\"#efc9a3\" stroke-width=\"20\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"110.0\" cy=\"205.0\" r=\"15\" fill=\"#f6dcc1\" stroke=\"#b98a60\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"110.0\" cy=\"105.0\" r=\"15\" fill=\"#f6dcc1\" stroke=\"#b98a60\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"223.0\" cy=\"105.0\" r=\"17\" fill=\"#efc9a3\" stroke=\"#b98a60\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"110.0\" y=\"246.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#0d9488\">shoulder<\/text><line x1=\"110.0\" y1=\"232.0\" x2=\"110.0\" y2=\"222.0\" stroke=\"#0d9488\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"70.0\" y=\"98.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#0d9488\">elbow<\/text><line x1=\"73.0\" y1=\"98.0\" x2=\"96.0\" y2=\"103.0\" stroke=\"#0d9488\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"132.0\" y=\"158.0\" font-size=\"12\" text-anchor=\"start\" font-weight=\"500\" fill=\"#2563eb\">upper arm<\/text><text x=\"132.0\" y=\"173.0\" font-size=\"12\" text-anchor=\"start\" font-weight=\"500\" fill=\"#2563eb\">(a link)<\/text><text x=\"165.0\" y=\"68.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#2563eb\">forearm (a link)<\/text><text x=\"222.0\" y=\"148.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#f97316\">hand<\/text><line x1=\"222.0\" y1=\"134.0\" x2=\"222.0\" y2=\"120.0\" stroke=\"#f97316\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"440,262 520,262 505,236 455,236\" fill=\"#475569\"/><line x1=\"480.0\" y1=\"205.0\" x2=\"480.0\" y2=\"105.0\" stroke=\"#2563eb\" stroke-width=\"18\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"480.0\" y1=\"105.0\" x2=\"585.0\" y2=\"105.0\" stroke=\"#0d9488\" stroke-width=\"18\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"480.0\" cy=\"205.0\" r=\"11\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"480.0\" cy=\"105.0\" r=\"11\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><line x1=\"591.0\" y1=\"91.0\" x2=\"607.0\" y2=\"91.0\" stroke=\"#1b2330\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"591.0\" y1=\"119.0\" x2=\"607.0\" y2=\"119.0\" stroke=\"#1b2330\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"591.0\" y1=\"91.0\" x2=\"591.0\" y2=\"119.0\" stroke=\"#1b2330\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"585.0\" cy=\"105.0\" r=\"7\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"2\" opacity=\"1\"/><text x=\"450.0\" y=\"210.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#0d9488\">joint<\/text><line x1=\"453.0\" y1=\"207.0\" x2=\"466.0\" y2=\"205.0\" stroke=\"#0d9488\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"450.0\" y=\"100.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#0d9488\">joint<\/text><line x1=\"453.0\" y1=\"100.0\" x2=\"466.0\" y2=\"104.0\" stroke=\"#0d9488\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"455.0\" y=\"158.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#2563eb\">link<\/text><text x=\"532.0\" y=\"74.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#2563eb\">link<\/text><text x=\"610.0\" y=\"150.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#f97316\">end effector<\/text><text x=\"610.0\" y=\"166.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#f97316\">(the tool)<\/text><line x1=\"600.0\" y1=\"136.0\" x2=\"588.0\" y2=\"114.0\" stroke=\"#f97316\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"480.0\" y=\"282.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">base<\/text><\/svg><figcaption>Same parts, same names. Joints are where it bends, links are the stiff pieces between them, and the end effector is the tip that does the work.<\/figcaption><\/figure>\n<p>Every arm is built from the same three kinds of parts:<\/p>\n<div class=\"cards\">\n<div class=\"cardlet j\"><b>Joint<\/b>a place that bends or turns<\/div>\n<div class=\"cardlet l\"><b>Link<\/b>a stiff piece between two joints<\/div>\n<div class=\"cardlet e\"><b>End effector<\/b>the tip that does the work. We also call it the tool<\/div>\n<\/div>\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 640 186\" role=\"img\" aria-label=\"A turning joint and a sliding joint\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"30.0\" y=\"77.0\" width=\"80.0\" height=\"26.0\" rx=\"10\" fill=\"#94a3b8\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><g transform=\"rotate(-35 110 90)\"><rect x=\"110.0\" y=\"77.0\" width=\"90.0\" height=\"26.0\" rx=\"10\" fill=\"#2563eb\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><\/g><circle cx=\"110.0\" cy=\"90.0\" r=\"13\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><path d=\"M160.0,90.0 A50,50 0 0 0 151.0,61.3\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"155.0\" y1=\"67.1\" x2=\"156.1\" y2=\"68.7\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"151.0,61.3 160.2,65.9 152.1,71.5\" fill=\"#f97316\" opacity=\"1\"/><text x=\"120.0\" y=\"152.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Turning joint<\/text><text x=\"120.0\" y=\"171.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(revolute): it rotates, like a hinge<\/text><rect x=\"400.0\" y=\"70.0\" width=\"120.0\" height=\"40.0\" rx=\"10\" fill=\"#94a3b8\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><rect x=\"470.0\" y=\"80.0\" width=\"120.0\" height=\"20.0\" rx=\"8\" fill=\"#0d9488\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><line x1=\"500.0\" y1=\"46.0\" x2=\"579.0\" y2=\"46.0\" stroke=\"#f97316\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"590.0,46.0 579.0,52.0 579.0,40.0\" fill=\"#f97316\" opacity=\"1\"/><text x=\"500.0\" y=\"152.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Sliding joint<\/text><text x=\"500.0\" y=\"171.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(prismatic): it slides, like a telescope<\/text><\/svg><figcaption>This guide uses turning joints only.<\/figcaption><\/figure>\n<p>Now the key idea. You can say where the arm is in <b>two different ways<\/b>:<\/p>\n<ol>\n<li>Say what each joint is doing, meaning its angle. That is one number per joint. This is called <b>joint space<\/b>.<\/li>\n<li>Say where the tool is, meaning its x and y. This is called <b>task space<\/b>.<\/li>\n<\/ol>\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 640 242\" role=\"img\" aria-label=\"Joint space and task space for the same arm pose\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"14.0\" y=\"14.0\" width=\"250.0\" height=\"214.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"139.0\" y=\"42.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#2563eb\">Joint space<\/text><text x=\"139.0\" y=\"61.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">what the joints are doing<\/text><path d=\"M102.6,126.8 A24,24 0 1 0 100.8,147.0\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"97.3\" y1=\"153.1\" x2=\"96.3\" y2=\"154.8\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"100.8,147.0 100.6,157.3 92.0,152.3\" fill=\"#f97316\" opacity=\"1\"/><text x=\"172.0\" y=\"130.0\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">θ₁ = 90°<\/text><text x=\"172.0\" y=\"152.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">joint 1<\/text><path d=\"M102.6,186.8 A24,24 0 1 0 100.8,207.0\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"97.3\" y1=\"213.1\" x2=\"96.3\" y2=\"214.8\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"100.8,207.0 100.6,217.3 92.0,212.3\" fill=\"#f97316\" opacity=\"1\"/><text x=\"172.0\" y=\"190.0\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">θ₂ = −90°<\/text><text x=\"172.0\" y=\"212.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">joint 2<\/text><rect x=\"376.0\" y=\"14.0\" width=\"250.0\" height=\"214.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"501.0\" y=\"42.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#f97316\">Task space<\/text><text x=\"501.0\" y=\"61.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">where the tool is<\/text><line x1=\"425.0\" y1=\"196.0\" x2=\"425.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"461.0\" y1=\"196.0\" x2=\"461.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"497.0\" y1=\"196.0\" x2=\"497.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"533.0\" y1=\"196.0\" x2=\"533.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"569.0\" y1=\"196.0\" x2=\"569.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"196.0\" x2=\"569.0\" y2=\"196.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"160.0\" x2=\"569.0\" y2=\"160.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"124.0\" x2=\"569.0\" y2=\"124.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"88.0\" x2=\"569.0\" y2=\"88.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"196.0\" x2=\"576.2\" y2=\"196.0\" stroke=\"#94a3b8\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"425.0\" y1=\"196.0\" x2=\"425.0\" y2=\"80.8\" stroke=\"#94a3b8\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"479.0\" y1=\"124.0\" x2=\"479.0\" y2=\"196.0\" stroke=\"#f97316\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"1\" stroke-dasharray=\"4 4\"/><line x1=\"479.0\" y1=\"124.0\" x2=\"425.0\" y2=\"124.0\" stroke=\"#f97316\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"1\" stroke-dasharray=\"4 4\"/><circle cx=\"479.0\" cy=\"124.0\" r=\"8\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"493.0\" y=\"129.0\" font-size=\"17\" text-anchor=\"start\" font-weight=\"700\" fill=\"#1b2330\">(1.5, 2.0)<\/text><line x1=\"274.0\" y1=\"100.0\" x2=\"354.0\" y2=\"100.0\" stroke=\"#2563eb\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"366.0,100.0 354.0,106.6 354.0,93.4\" fill=\"#2563eb\" opacity=\"1\"/><text x=\"320.0\" y=\"88.0\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#2563eb\">FK<\/text><text x=\"320.0\" y=\"118.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">just calculate<\/text><line x1=\"366.0\" y1=\"160.0\" x2=\"286.0\" y2=\"160.0\" stroke=\"#f97316\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"274.0,160.0 286.0,153.4 286.0,166.6\" fill=\"#f97316\" opacity=\"1\"/><text x=\"320.0\" y=\"148.0\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#f97316\">IK<\/text><text x=\"320.0\" y=\"178.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">needs solving<\/text><\/svg><figcaption>One arm, one pose, two descriptions. FK turns the left one into the right one. IK goes back.<\/figcaption><\/figure>\n<p>Going from the first description to the second is <b>forward kinematics (FK)<\/b>. Going back is <b>inverse kinematics (IK)<\/b>. The rest of the guide is those two arrows.<\/p>\n<p class=\"try\"><b>Try it:<\/b> move the sliders. The arm is the same arm. Only the way we describe it changes.<\/p>\n{{viz:fkjoint}}\n<p class=\"small\">Angles count counter-clockwise. θ₂ is measured from link 1, not from the x-axis. The number of joint-space numbers is the arm’s <i>degrees of freedom<\/i>.<\/p>\n", "example": "The 2-link arm with link lengths 2.0 and 1.5.\n<ul>\n<li><b>Joint space:<\/b> θ₁ = 90° and θ₂ = −90°. Link 1 points straight up. Link 2 turns clockwise by 90°, so it points right.<\/li>\n<li><b>Task space:<\/b> the tool is at (1.5, 2.0).<\/li>\n<\/ul>\nTwo joints give two numbers. A tool on a flat table also takes two numbers (x and y). Step 2 shows how to get from the first pair to the second.", "remember": "Joint space = what the joints do. Task space = where the tool is. FK goes from one to the other, IK goes back.", "quiz": [{"q": "The 2-link arm is at θ₁ = 90°, θ₂ = −90°. Which statement describes the arm in task space?", "opts": ["Joint 1 is turned 90°.", "Joint 2 is turned −90°.", "Both joints are revolute joints.", "The tool is at (1.5, 2.0)."], "a": 3, "why": "Task space says where the tool is. The other statements give joint values or joint types, which belong to joint space.", "step": null}, {"q": "A desk lamp has a base that turns and two hinges. Counting each as one joint, how many numbers fix the lamp’s pose in joint space?", "opts": ["1", "2", "3", "6"], "a": 2, "why": "One number per joint: the base turn plus two hinges makes three.", "step": null}]}, {"id": "s2", "num": 2, "group": "fk", "label": "FK of a 2-link arm", "type": "learn", "viz": "fk", "big": "Forward kinematics is a recipe. Give it the joint angles and it tells you where the tool is.", "picture": "Walking directions: face one way and walk 2 steps, turn a bit more, then walk 1.5 steps. Where you stop is the tool.", "body": "\n<p>Put the base at (0, 0). Link 1 is 2.0 long and link 2 is 1.5 long. θ₁ is the angle of link 1 from the x-axis. θ₂ is how much link 2 turns <i>away from link 1<\/i>. So in the room, link 2 faces <b>θ₁ + θ₂<\/b>.<\/p>\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 520 372\" role=\"img\" aria-label=\"The 2-link arm as walk, turn, walk\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"55.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"165.0\" y1=\"340.0\" x2=\"165.0\" y2=\"55.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"165.0\" y=\"355.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">1<\/text><line x1=\"260.0\" y1=\"340.0\" x2=\"260.0\" y2=\"55.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"260.0\" y=\"355.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">2<\/text><line x1=\"355.0\" y1=\"340.0\" x2=\"355.0\" y2=\"55.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"355.0\" y=\"355.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">3<\/text><line x1=\"70.0\" y1=\"340.0\" x2=\"355.0\" y2=\"340.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"245.0\" x2=\"355.0\" y2=\"245.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"249.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">1<\/text><line x1=\"70.0\" y1=\"150.0\" x2=\"355.0\" y2=\"150.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"154.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">2<\/text><line x1=\"70.0\" y1=\"55.0\" x2=\"355.0\" y2=\"55.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"59.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">3<\/text><line x1=\"70.0\" y1=\"340.0\" x2=\"355.0\" y2=\"340.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"55.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"234.5\" y1=\"245.0\" x2=\"308.6\" y2=\"202.3\" stroke=\"#7aa2f7\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\" stroke-dasharray=\"3 6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"234.5\" y2=\"245.0\" stroke=\"#2563eb\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"234.5\" y1=\"245.0\" x2=\"234.5\" y2=\"102.5\" stroke=\"#0d9488\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"70.0\" cy=\"340.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"234.5\" cy=\"245.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><polygon points=\"52.0,360.0 88.0,360.0 81.0,348.0 59.0,348.0\" fill=\"#475569\"/><path d=\"M128.0,340.0 A58,58 0 0 0 120.2,311.0\" fill=\"none\" stroke=\"#1d4ed8\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"148.0\" y=\"328.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#1d4ed8\">θ₁ = 30°<\/text><path d=\"M272.6,223.0 A44,44 0 0 0 234.5,201.0\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"246.5\" y=\"183.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#0d9488\">θ₂ = 60°<\/text><circle cx=\"234.5\" cy=\"102.5\" r=\"9\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"214.5\" y=\"233.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#1b2330\">elbow (1.73, 1.00)<\/text><text x=\"250.5\" y=\"107.5\" font-size=\"14\" text-anchor=\"start\" font-weight=\"700\" fill=\"#c2410c\">tool (1.73, 2.50)<\/text><text x=\"188.8\" y=\"304.1\" font-size=\"13\" text-anchor=\"start\" font-weight=\"600\" fill=\"#2563eb\">1. walk 2,<\/text><text x=\"188.8\" y=\"320.1\" font-size=\"13\" text-anchor=\"start\" font-weight=\"600\" fill=\"#2563eb\">facing 30°<\/text><text x=\"222.5\" y=\"173.8\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#0d9488\">3. walk 1.5,<\/text><text x=\"222.5\" y=\"189.8\" font-size=\"13\" text-anchor=\"end\" font-weight=\"600\" fill=\"#0d9488\">now facing 90°<\/text><text x=\"318.5\" y=\"223.0\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" fill=\"#8b96a8\">2. turn 60° more<\/text><\/svg><figcaption>Walk 2 facing 30°. Turn 60° more, so you now face 90°. Walk 1.5 more. The tool is where you stop.<\/figcaption><\/figure>\n<p>Add the two steps and you get the tool position:<\/p>\n<div class=\"eq\">x = L₁ cos θ₁ + L₂ cos(θ₁ + θ₂)<br>y = L₁ sin θ₁ + L₂ sin(θ₁ + θ₂)<\/div>\n<p>The first part of each line is where link 1 ends (the elbow). The second part is the step along link 2.<\/p>\n{{viz:fk}}\n<p class=\"try\"><b>Try:<\/b> set θ₂ = 0°. The arm is straight and reaches as far as it can (3.5). Set θ₂ = 180°. It folds back and the tool is 0.5 from the base. Then set (90°, −90°) and find the tool from Step 1.<\/p>\n", "example": "θ₁ = 30°, θ₂ = 60°.\n<ul>\n<li>Elbow = (2 cos 30°, 2 sin 30°) = (1.73, 1.00).<\/li>\n<li>Link 2 points at 30° + 60° = 90°, straight up, so it adds (0, 1.5).<\/li>\n<li>Tool = (1.73, 2.50).<\/li>\n<\/ul>", "remember": "The second angle is relative, so link 2’s direction in the room is the sum θ₁ + θ₂.", "quiz": [{"q": "With L₁ = 2.0 and L₂ = 1.5, where is the tool when θ₁ = 0° and θ₂ = 90°?", "opts": ["(3.5, 0.0)", "(2.0, 1.5)", "(1.5, 2.0)", "(0.0, 3.5)"], "a": 1, "why": "Link 1 lies along the x-axis and ends at (2.0, 0). Link 2 points at 0° + 90° = 90°, straight up, adding (0, 1.5). The tool is at (2.0, 1.5).", "step": null}, {"q": "θ₁ = 30° and θ₂ = 60°. In which direction does link 2 point in the room?", "opts": ["30°", "60°", "90°", "180°"], "a": 2, "why": "The second angle is measured from link 1, so link 2’s world direction is θ₁ + θ₂ = 30° + 60° = 90°.", "step": null}]}, {"id": "s3", "num": 3, "group": "fk", "label": "FK of a longer or 3D arm", "type": "learn", "viz": "arm3d", "big": "A longer or 3D arm is the same idea: a list of simple moves, done one after another. In frame language, you multiply their 4×4 transforms from base to tool.", "picture": "Directions again, but longer: turn around, climb one stair, tilt your head up, walk 2 m, bend, walk 1.5 m. Each instruction starts from where the last one left you.", "body": "\n<p>From the last guide: a 4×4 transform holds a turn and a shift, and you chain transforms by multiplying them, base first. Only two kinds of move are needed: a <b>Turn<\/b> (what a joint does) and a <b>Slide<\/b> (what a link does).<\/p>\n<p>Our little 3D arm has a base that spins (φ), a shoulder hinge on a post of height h = 1 (α), link 1 (2 long), an elbow hinge (β) and link 2 (1.5 long). That makes six moves:<\/p>\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 760 258\" role=\"img\" aria-label=\"The six moves of the 3D arm and the point after each one\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"12.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"30.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"30.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">1<\/text><g transform=\"translate(68,80)\"><path d=\"M15.6,-9.0 A18,18 0 1 0 9.0,15.6\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"2.9\" y1=\"19.1\" x2=\"1.2\" y2=\"20.1\" stroke=\"#f97316\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"9.0,15.6 3.7,24.4 -1.3,15.8\" fill=\"#f97316\" opacity=\"1\"/><\/g><text x=\"68.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Turn base<\/text><text x=\"68.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">φ = 90°<\/text><line x1=\"68.0\" y1=\"166.0\" x2=\"68.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"68.0,188.0 63.6,180.0 72.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"12.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff\" stroke=\"#cdd5e1\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"68.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#1b2330\">(0, 0, 0)<\/text><line x1=\"125.0\" y1=\"87.0\" x2=\"128.0\" y2=\"87.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"135.0,87.0 128.0,90.8 128.0,83.2\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"136.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"154.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"154.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">2<\/text><g transform=\"translate(192,80)\"><line x1=\"0.0\" y1=\"18.0\" x2=\"-0.0\" y2=\"-9.0\" stroke=\"#f97316\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"0.0,-20.0 6.0,-9.0 -6.1,-9.0\" fill=\"#f97316\" opacity=\"1\"/><\/g><text x=\"192.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Lift<\/text><text x=\"192.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">h = 1<\/text><line x1=\"192.0\" y1=\"166.0\" x2=\"192.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"192.0,188.0 187.6,180.0 196.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"136.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff\" stroke=\"#cdd5e1\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"192.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#1b2330\">(0, 0, 1)<\/text><line x1=\"249.0\" y1=\"87.0\" x2=\"252.0\" y2=\"87.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"259.0,87.0 252.0,90.8 252.0,83.2\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"260.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"278.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"278.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">3<\/text><g transform=\"translate(316,80)\"><line x1=\"-18.0\" y1=\"12.0\" x2=\"18.0\" y2=\"12.0\" stroke=\"#94a3b8\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"-18.0\" y1=\"12.0\" x2=\"14.0\" y2=\"-10.0\" stroke=\"#f97316\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><path d=\"M6.0,12.0 A24,24 0 0 0 2.1,-1.1\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/g><text x=\"316.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Tilt up<\/text><text x=\"316.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">α = 0°<\/text><line x1=\"316.0\" y1=\"166.0\" x2=\"316.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"316.0,188.0 311.6,180.0 320.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"260.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff\" stroke=\"#cdd5e1\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"316.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#1b2330\">(0, 0, 1)<\/text><line x1=\"373.0\" y1=\"87.0\" x2=\"376.0\" y2=\"87.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"383.0,87.0 376.0,90.8 376.0,83.2\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"384.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"402.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"402.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">4<\/text><g transform=\"translate(440,80)\"><line x1=\"-22.0\" y1=\"0.0\" x2=\"11.0\" y2=\"0.0\" stroke=\"#f97316\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"22.0,0.0 11.0,6.1 11.0,-6.1\" fill=\"#f97316\" opacity=\"1\"/><line x1=\"-22.0\" y1=\"-6.0\" x2=\"-22.0\" y2=\"6.0\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"1\"/><\/g><text x=\"440.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Slide<\/text><text x=\"440.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">L₁ = 2<\/text><line x1=\"440.0\" y1=\"166.0\" x2=\"440.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"440.0,188.0 435.6,180.0 444.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"384.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff\" stroke=\"#cdd5e1\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"440.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#1b2330\">(0, 2, 1)<\/text><line x1=\"497.0\" y1=\"87.0\" x2=\"500.0\" y2=\"87.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"507.0,87.0 500.0,90.8 500.0,83.2\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"508.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"526.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"526.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">5<\/text><g transform=\"translate(564,80)\"><line x1=\"-20.0\" y1=\"12.0\" x2=\"0.0\" y2=\"12.0\" stroke=\"#94a3b8\" stroke-width=\"5\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"0.0\" y1=\"12.0\" x2=\"0.0\" y2=\"-16.0\" stroke=\"#f97316\" stroke-width=\"5\" stroke-linecap=\"round\" opacity=\"1\"/><path d=\"M18.0,12.0 A18,18 0 0 0 0.0,-6.0\" fill=\"none\" stroke=\"#f97316\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/g><text x=\"564.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Bend up<\/text><text x=\"564.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">β = 90°<\/text><line x1=\"564.0\" y1=\"166.0\" x2=\"564.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"564.0,188.0 559.6,180.0 568.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"508.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff\" stroke=\"#cdd5e1\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"564.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#1b2330\">(0, 2, 1)<\/text><line x1=\"621.0\" y1=\"87.0\" x2=\"624.0\" y2=\"87.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"631.0,87.0 624.0,90.8 624.0,83.2\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"632.0\" y=\"12.0\" width=\"112.0\" height=\"150.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><circle cx=\"650.0\" cy=\"32.0\" r=\"12\" fill=\"#2563eb\" stroke=\"#2563eb\" stroke-width=\"1\" opacity=\"1\"/><text x=\"650.0\" y=\"37.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#fff\">6<\/text><g transform=\"translate(688,80)\"><line x1=\"-22.0\" y1=\"0.0\" x2=\"11.0\" y2=\"0.0\" stroke=\"#f97316\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"22.0,0.0 11.0,6.1 11.0,-6.1\" fill=\"#f97316\" opacity=\"1\"/><line x1=\"-22.0\" y1=\"-6.0\" x2=\"-22.0\" y2=\"6.0\" stroke=\"#f97316\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"1\"/><\/g><text x=\"688.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Slide<\/text><text x=\"688.0\" y=\"146.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">L₂ = 1.5<\/text><line x1=\"688.0\" y1=\"166.0\" x2=\"688.0\" y2=\"180.0\" stroke=\"#8b96a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"688.0,188.0 683.6,180.0 692.4,180.0\" fill=\"#8b96a8\" opacity=\"1\"/><rect x=\"632.0\" y=\"192.0\" width=\"112.0\" height=\"36.0\" rx=\"12\" fill=\"#fff7ed\" stroke=\"#f97316\" stroke-width=\"2\" opacity=\"1\"/><text x=\"688.0\" y=\"215.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">(0, 2, 2.5)<\/text><text x=\"380.0\" y=\"248.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">point after each move (x, y, z)<\/text><\/svg><figcaption>Six moves, one after another. The last point is the tool: (0, 2, 2.5).<\/figcaption><\/figure>\n<div class=\"eq small\">T = Turn(φ) · Lift(h) · Tilt(α) · Slide(L₁) · Bend(β) · Slide(L₂)<\/div>\n<p>The tool position is the last column of T. Try the sliders: the table shows the point after each move. Drag the picture to look around.<\/p>\n{{viz:arm3d}}\n<p>A turn or bend does not move the point it turns about. It only changes where the <i>next<\/i> slide goes. A longer arm is the same chain with more moves.<\/p>\n", "example": "φ = 90°, α = 0°, β = 90°. Point after each move:\n<ol>\n<li>Turn base: still at the origin (0, 0, 0). The arm now faces +y.<\/li>\n<li>Lift by 1: (0, 0, 1).<\/li>\n<li>Tilt by 0°: nothing changes, (0, 0, 1).<\/li>\n<li>Slide 2 along the arm (toward +y): (0, 2, 1).<\/li>\n<li>Bend up by 90°: the point stays at (0, 2, 1), but the arm now points up.<\/li>\n<li>Slide 1.5 upward: (0.0, 2.0, 2.5).<\/li>\n<\/ol>\nTool = (0.0, 2.0, 2.5).", "remember": "Order matters: each move is measured in the frame the previous move left behind.", "quiz": [{"q": "In the 3D arm, φ = 0°, α = 90° and β = 0° (shoulder tilted straight up, elbow straight). Where is the tool?", "opts": ["(3.5, 0.0, 1.0)", "(0.0, 0.0, 4.5)", "(0.0, 3.5, 1.0)", "(0.0, 0.0, 3.5)"], "a": 1, "why": "The arm points straight up, so x and y stay 0. Height = shoulder height 1.0 + 2.0 + 1.5 = 4.5. Forgetting the 1.0 gives 3.5.", "step": null}, {"q": "You walk 2 m forward and then turn left 90°. A friend turns left 90° first and then walks 2 m forward. Do you end up in the same place?", "opts": ["No. The turn changes the direction of the walk, so the end points differ.", "Yes, the order of moves never matters.", "Yes, as long as both walk the same distance.", "Only if the turn is smaller than 45°."], "a": 0, "why": "A turn changes the direction of everything that comes after it. That is why chained transforms cannot be swapped.", "step": null}]}, {"id": "s4", "num": 4, "group": "ik", "label": "Inverse kinematics: the question reversed", "type": "learn", "big": "Inverse kinematics asks the question the other way round: the tool should be there, so what should the joints do?", "picture": "A map app. FK is “I took these turns, where am I?”. IK is “I want to reach the café, which turns do I take?”. There may be two good routes, or none.", "body": "\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 680 226\" role=\"img\" aria-label=\"Forward kinematics versus inverse kinematics\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"14.0\" y=\"24.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#2563eb\">Forward (FK): you know the turns<\/text><rect x=\"14.0\" y=\"36.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#2563eb\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"109.0\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Joint angles<\/text><text x=\"109.0\" y=\"83.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(θ₁, θ₂)<\/text><line x1=\"214.0\" y1=\"67.0\" x2=\"454.0\" y2=\"67.0\" stroke=\"#2563eb\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"466.0,67.0 454.0,73.6 454.0,60.4\" fill=\"#2563eb\" opacity=\"1\"/><text x=\"340.0\" y=\"58.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#2563eb\">plug into the formula<\/text><rect x=\"476.0\" y=\"36.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#2563eb\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"571.0\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Tool position<\/text><text x=\"571.0\" y=\"83.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(x, y)<\/text><text x=\"340.0\" y=\"88.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">always exactly one answer<\/text><text x=\"14.0\" y=\"138.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#c2410c\">Inverse (IK): you know the destination<\/text><rect x=\"14.0\" y=\"150.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#f97316\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"109.0\" y=\"176.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Tool position<\/text><text x=\"109.0\" y=\"197.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(x, y)<\/text><line x1=\"214.0\" y1=\"181.0\" x2=\"454.0\" y2=\"181.0\" stroke=\"#f97316\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"466.0,181.0 454.0,187.6 454.0,174.4\" fill=\"#f97316\" opacity=\"1\"/><text x=\"340.0\" y=\"172.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#c2410c\">solve the equations<\/text><rect x=\"476.0\" y=\"150.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#f97316\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"571.0\" y=\"176.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Joint angles<\/text><text x=\"571.0\" y=\"197.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(θ₁, θ₂) ?<\/text><text x=\"340.0\" y=\"202.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">none, one or several answers<\/text><\/svg><figcaption>Like a map app: FK is “where do these turns take me?”. IK is “which turns reach the café?”.<\/figcaption><\/figure>\n<p>FK is a formula: plug in the angles and out comes one answer. IK means solving equations with sines and cosines, and the result can be <b>none<\/b>, <b>one<\/b>, <b>several<\/b>, or even infinitely many answers.<\/p>\n<p>There are two ways to solve it:<\/p>\n<ul class=\"terms\">\n<li><b>Closed form:<\/b> pencil-and-paper geometry that gives the angles directly. It works for simple arms like our 2-link one (Step 5; Section 6.1 of the book).<\/li>\n<li><b>Numerical:<\/b> start from a guess and improve it in a loop. It works for almost any arm (Step 7; Section 6.2 of the book).<\/li>\n<\/ul>\n<p>Either way you can <b>always check an answer<\/b>: put the angles into FK and see whether the tool lands on the target.<\/p>\n", "example": "Target: (1.5, 2.0). Two candidate answers:\n<ul>\n<li><b>(90°, −90°)<\/b>: FK gives (1.50, 2.00). It works.<\/li>\n<li><b>(16.26°, 90°)<\/b>: x = 2 cos 16.26° + 1.5 cos 106.26° = 1.92 − 0.42 = 1.50; y = 2 sin 16.26° + 1.5 sin 106.26° = 0.56 + 1.44 = 2.00. It works too.<\/li>\n<\/ul>\nOne target, two valid answers. Step 5 shows where they come from.", "remember": "IK asks for angles given a target. Always verify an answer with FK.", "quiz": [{"q": "Which of these is an inverse kinematics problem?", "opts": ["Given the joint angles, find where the tool is.", "Given the joint angles, find the torques needed.", "Given the link lengths, find the weight of the arm.", "Given a target position for the tool, find the joint angles that reach it."], "a": 3, "why": "IK goes from task space (tool position) back to joint space (angles). Computing the tool position from angles is FK.", "step": null}, {"q": "A solver says the angles (16.26°, 90°) reach the target (1.5, 2.0). What is the best quick check?", "opts": ["Check that both angles are below 180°.", "Multiply the two angles together.", "It cannot be checked without a second solver.", "Run FK on those angles and see whether the tool lands at (1.5, 2.0)."], "a": 3, "why": "FK is easy to compute, so it is the natural test of any IK answer.", "step": null}], "after": "<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 430 332\" role=\"img\" aria-label=\"Two different arm shapes reaching the same target\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"160.0\" y1=\"300.0\" x2=\"160.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"160.0\" y=\"315.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">1<\/text><line x1=\"250.0\" y1=\"300.0\" x2=\"250.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"250.0\" y=\"315.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">2<\/text><line x1=\"340.0\" y1=\"300.0\" x2=\"340.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"340.0\" y=\"315.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">3<\/text><line x1=\"70.0\" y1=\"300.0\" x2=\"340.0\" y2=\"300.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"210.0\" x2=\"340.0\" y2=\"210.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"214.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">1<\/text><line x1=\"70.0\" y1=\"120.0\" x2=\"340.0\" y2=\"120.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"124.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">2<\/text><line x1=\"70.0\" y1=\"30.0\" x2=\"340.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"64.0\" y=\"34.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"500\" fill=\"#8b96a8\">3<\/text><line x1=\"70.0\" y1=\"300.0\" x2=\"340.0\" y2=\"300.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"242.8\" y2=\"249.6\" stroke=\"#93b4f5\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"0.55\"/><line x1=\"242.8\" y1=\"249.6\" x2=\"205.0\" y2=\"120.0\" stroke=\"#6dd0c6\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"0.55\"/><circle cx=\"70.0\" cy=\"300.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"0.55\"/><circle cx=\"242.8\" cy=\"249.6\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"0.55\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"120.0\" stroke=\"#2563eb\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"120.0\" x2=\"205.0\" y2=\"120.0\" stroke=\"#0d9488\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"70.0\" cy=\"300.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"70.0\" cy=\"120.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><polygon points=\"52.0,320.0 88.0,320.0 81.0,308.0 59.0,308.0\" fill=\"#475569\"/><circle cx=\"205.0\" cy=\"120.0\" r=\"10\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"3\" opacity=\"1\"/><text x=\"221.0\" y=\"108.0\" font-size=\"14\" text-anchor=\"start\" font-weight=\"700\" fill=\"#c2410c\">target (1.5, 2.0)<\/text><text x=\"80.0\" y=\"100.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#2563eb\">A: (90°, −90°)<\/text><text x=\"254.8\" y=\"273.6\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#4f7be0\">B: (16.26°, 90°)<\/text><\/svg><figcaption>Two valid answers for one target: A has the elbow up, B has it down.<\/figcaption><\/figure>"}, {"id": "s5", "num": 5, "group": "ik", "label": "Solving a 2-link arm", "type": "learn", "viz": "ik", "big": "The two links and the straight line to the target make a triangle. The triangle fixes the elbow angle, in two mirror-image ways.", "picture": "Reaching for a cup: you can do it with your elbow out or tucked in. A cup too far away cannot be reached. A cup right under your chin cannot either, because your arm cannot fold that tightly.", "body": "\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 430 332\" role=\"img\" aria-label=\"The triangle formed by the two links and the distance to the target\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"160.0\" y1=\"300.0\" x2=\"160.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"250.0\" y1=\"300.0\" x2=\"250.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"340.0\" y1=\"300.0\" x2=\"340.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"340.0\" y2=\"300.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"210.0\" x2=\"340.0\" y2=\"210.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"120.0\" x2=\"340.0\" y2=\"120.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"340.0\" y2=\"30.0\" stroke=\"#e6eaf1\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"340.0\" y2=\"300.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#b7c0cf\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"70.0,300.0 242.8,249.6 205.0,120.0\" fill=\"#e0e7ff\" fill-opacity=\".5\" stroke=\"#6b8de0\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><polygon points=\"70.0,300.0 70.0,120.0 205.0,120.0\" fill=\"#dbeafe\" fill-opacity=\".8\" stroke=\"#2563eb\" stroke-width=\"3\"/><line x1=\"70.0\" y1=\"300.0\" x2=\"70.0\" y2=\"120.0\" stroke=\"#2563eb\" stroke-width=\"10\" stroke-linecap=\"round\" opacity=\"0.9\"/><line x1=\"70.0\" y1=\"120.0\" x2=\"205.0\" y2=\"120.0\" stroke=\"#0d9488\" stroke-width=\"10\" stroke-linecap=\"round\" opacity=\"0.9\"/><circle cx=\"70.0\" cy=\"300.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"70.0\" cy=\"120.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"205.0\" cy=\"120.0\" r=\"9\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"3\" opacity=\"1\"/><polygon points=\"52.0,320.0 88.0,320.0 81.0,308.0 59.0,308.0\" fill=\"#475569\"/><polyline points=\"84,120 84,134 70,134\" fill=\"none\" stroke=\"#1b2330\" stroke-width=\"1.6\"/><text x=\"58.0\" y=\"214.0\" font-size=\"14\" text-anchor=\"end\" font-weight=\"700\" fill=\"#2563eb\">L₁ = 2<\/text><text x=\"137.5\" y=\"106.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#0d9488\">L₂ = 1.5<\/text><text x=\"149.5\" y=\"232.0\" font-size=\"14\" text-anchor=\"start\" font-weight=\"700\" fill=\"#1b2330\">d = 2.5<\/text><text x=\"56.0\" y=\"106.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\" fill=\"#2563eb\">elbow<\/text><circle cx=\"242.8\" cy=\"249.6\" r=\"6\" fill=\"#fff\" stroke=\"#6b8de0\" stroke-width=\"2\" opacity=\"1\"/><text x=\"256.8\" y=\"269.6\" font-size=\"12\" text-anchor=\"start\" font-weight=\"500\" fill=\"#4f7be0\">mirror-image elbow<\/text><text x=\"219.0\" y=\"112.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#c2410c\">target<\/text><\/svg><figcaption>The two links and the straight line to the target make a triangle with sides 2, 1.5 and 2.5. Flip it over the line from base to target and you get the other elbow.<\/figcaption><\/figure>\n<p>The recipe for a target (x, y):<\/p>\n<ol>\n<li><b>Check the reach.<\/b> d = √(x² + y²) must lie between |L₁ − L₂| = 0.5 and L₁ + L₂ = 3.5. That ring is the <b>reachable workspace<\/b>.<\/li>\n<li><b>Find the elbow angle<\/b> from the triangle (law of cosines):\n<div class=\"eq small\">cos θ₂ = (d² − L₁² − L₂²) / (2 L₁ L₂)<\/div>\nThere are two answers: θ₂ = −acos(…) is <b>elbow up<\/b>, and θ₂ = +acos(…) is <b>elbow down<\/b>.<\/li>\n<li><b>Find the shoulder angle:<\/b> the direction to the target, minus the angle the triangle makes at the base:\n<div class=\"eq small\">θ₁ = atan2(y, x) − atan2(L₂ sin θ₂, L₁ + L₂ cos θ₂)<\/div><\/li>\n<\/ol>\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 480 420\" role=\"img\" aria-label=\"Reachable ring, too-close hole and too-far outside\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"240\" cy=\"210\" r=\"182.0\" fill=\"#dbeafe\" stroke=\"#6b8de0\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><circle cx=\"240\" cy=\"210\" r=\"26.0\" fill=\"#fff\" stroke=\"#b91c1c\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><line x1=\"20.0\" y1=\"210.0\" x2=\"460.0\" y2=\"210.0\" stroke=\"#b7c0cf\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"240.0\" y1=\"14.0\" x2=\"240.0\" y2=\"406.0\" stroke=\"#b7c0cf\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"240.0\" cy=\"210.0\" r=\"6\" fill=\"#334155\" stroke=\"#fff\" stroke-width=\"2\" opacity=\"1\"/><text x=\"22.0\" y=\"34.0\" font-size=\"15\" text-anchor=\"start\" font-weight=\"700\" fill=\"#b91c1c\">too far<\/text><text x=\"22.0\" y=\"52.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"500\" fill=\"#8b96a8\">d > 3.5<\/text><text x=\"240.0\" y=\"342.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#2563eb\">reachable<\/text><text x=\"240.0\" y=\"360.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">0.5 ≤ d ≤ 3.5<\/text><text x=\"240.0\" y=\"262.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#b91c1c\">too close<\/text><text x=\"240.0\" y=\"276.0\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">d < 0.5<\/text><circle cx=\"318.0\" cy=\"106.0\" r=\"8\" fill=\"#16a34a\" stroke=\"#fff\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"306.0\" y=\"98.0\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#16a34a\">(1.5, 2)<\/text><text x=\"306.0\" y=\"114.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\" fill=\"#16a34a\">d = 2.5<\/text><line x1=\"388.0\" y1=\"98.0\" x2=\"404.0\" y2=\"114.0\" stroke=\"#b91c1c\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"404.0\" y1=\"98.0\" x2=\"388.0\" y2=\"114.0\" stroke=\"#b91c1c\" stroke-width=\"3.5\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"410.0\" y=\"104.0\" font-size=\"13\" text-anchor=\"start\" font-weight=\"700\" fill=\"#b91c1c\">(3, 2)<\/text><text x=\"410.0\" y=\"120.0\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" fill=\"#b91c1c\">d = 3.61<\/text><line x1=\"245.4\" y1=\"194.6\" x2=\"255.4\" y2=\"204.6\" stroke=\"#b91c1c\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"255.4\" y1=\"194.6\" x2=\"245.4\" y2=\"204.6\" stroke=\"#b91c1c\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><text x=\"216.4\" y=\"163.6\" font-size=\"12\" text-anchor=\"end\" font-weight=\"700\" fill=\"#b91c1c\">(0.2, 0.2), d = 0.28<\/text><line x1=\"246.4\" y1=\"193.6\" x2=\"220.4\" y2=\"168.6\" stroke=\"#b91c1c\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\"/><\/svg><figcaption>The arm reaches a ring: from |L₁ − L₂| = 0.5 out to L₁ + L₂ = 3.5.<\/figcaption><\/figure>\n<p>“Elbow up” here means link 2 bends clockwise (θ₂ &lt; 0). It looks like elbow up when the target is on the right.<\/p>\n{{viz:ik}}\n<p class=\"try\"><b>Try:<\/b> drag the target around the ring and flip the toggle. Then pull it outside the ring, or into the small hole near the base, and read the message.<\/p>\n", "example": "Target (1.5, 2.0).\n<ol>\n<li>d² = 2.25 + 4.00 = 6.25, so d = 2.5. That is inside [0.5, 3.5].<\/li>\n<li>cos θ₂ = (6.25 − 4.00 − 2.25) / 6.0 = 0, so θ₂ = ±90°.<\/li>\n<li>The direction to the target is atan2(2, 1.5) = 53.13°.\n For θ₂ = −90° the triangle angle is −36.87°, so θ₁ = 53.13° + 36.87° = 90°.\n For θ₂ = +90° it is 36.87°, so θ₁ = 53.13° − 36.87° = 16.26°.<\/li>\n<\/ol>\nBoth match Step 4. <b>Out of reach:<\/b> target (3, 2) has d = √13 = 3.61, which is more than 3.5. The recipe gives cos θ₂ = (13 − 4.00 − 2.25) / 6.0 = 1.125. No angle has a cosine above 1, so there is no solution.", "remember": "Check d first. Inside the ring: two solutions (one at the edges). Outside the ring: none.", "quiz": [{"q": "With L₁ = 2.0 and L₂ = 1.5, which target is out of reach?", "opts": ["(3, 0)", "(2, 2)", "(3, 2)", "(1, 0)"], "a": 2, "why": "Distances: (3, 0) is 3.00, (2, 2) is 2.83, (1, 0) is 1.00, and (3, 2) is 3.61. The reach is between 0.5 and 3.5, so only (3, 2) is too far.", "step": null}, {"q": "For the target (1.5, 2.0) the elbow-up solution is (90°, −90°). What is the elbow-down value of θ₂?", "opts": ["−90°", "+90°", "0°", "180°"], "a": 1, "why": "The two solutions have elbow angles of equal size and opposite sign, ±acos(cos θ₂). Here that is ±90°, and the elbow-down arm has θ₁ = 16.26°.", "step": null}]}, {"id": "s6", "num": 6, "group": "ik", "label": "Singularities", "type": "learn", "big": "A singularity is a pose where the arm loses a direction: it cannot move the tool some ways. The classic case is a fully stretched arm.", "picture": "Lock your elbow and reach straight out. You cannot push your hand any farther along the line of your arm, and turning at the shoulder only swings the hand sideways.", "body": "\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 760 300\" role=\"img\" aria-label=\"A stretched arm can only move the tool sideways; a bent arm can move it in any direction\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"8.0\" y=\"8.0\" width=\"360.0\" height=\"284.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"188.0\" y=\"34.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Stretched: θ₂ = 0°<\/text><line x1=\"46.0\" y1=\"190.0\" x2=\"266.0\" y2=\"190.0\" stroke=\"#b7c0cf\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"1\" stroke-dasharray=\"4 4\"/><line x1=\"46.0\" y1=\"190.0\" x2=\"156.0\" y2=\"190.0\" stroke=\"#2563eb\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"156.0\" y1=\"190.0\" x2=\"238.5\" y2=\"190.0\" stroke=\"#0d9488\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"46.0\" cy=\"190.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"156.0\" cy=\"190.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><polygon points=\"28.0,210.0 64.0,210.0 57.0,198.0 35.0,198.0\" fill=\"#475569\"/><line x1=\"242.5\" y1=\"190.0\" x2=\"286.5\" y2=\"190.0\" stroke=\"#b91c1c\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"0.9\"/><polygon points=\"298.5,190.0 286.5,196.6 286.5,183.4\" fill=\"#b91c1c\" opacity=\"0.9\"/><line x1=\"274.5\" y1=\"177.0\" x2=\"292.5\" y2=\"203.0\" stroke=\"#b91c1c\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"292.5\" y1=\"177.0\" x2=\"274.5\" y2=\"203.0\" stroke=\"#b91c1c\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"238.5\" y1=\"182.0\" x2=\"238.5\" y2=\"146.0\" stroke=\"#16a34a\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"238.5,134.0 245.1,146.0 231.9,146.0\" fill=\"#16a34a\" opacity=\"1\"/><line x1=\"238.5\" y1=\"198.0\" x2=\"238.5\" y2=\"234.0\" stroke=\"#16a34a\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"238.5,246.0 231.9,234.0 245.1,234.0\" fill=\"#16a34a\" opacity=\"1\"/><circle cx=\"238.5\" cy=\"190.0\" r=\"9\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"188.0\" y=\"268.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#16a34a\">the tool can only go sideways<\/text><text x=\"188.0\" y=\"284.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#b91c1c\">not farther out (red)<\/text><rect x=\"388.0\" y=\"8.0\" width=\"364.0\" height=\"284.0\" rx=\"14\" fill=\"#f3f5f9\" stroke=\"none\" stroke-width=\"1.5\" opacity=\"1\"/><text x=\"570.0\" y=\"34.0\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">Bent: θ₁ = 30°, θ₂ = 60°<\/text><line x1=\"450.0\" y1=\"250.0\" x2=\"550.5\" y2=\"192.0\" stroke=\"#2563eb\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><line x1=\"550.5\" y1=\"192.0\" x2=\"550.5\" y2=\"105.0\" stroke=\"#0d9488\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"1\"/><circle cx=\"450.0\" cy=\"250.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><circle cx=\"550.5\" cy=\"192.0\" r=\"7\" fill=\"#fff\" stroke=\"#1b2330\" stroke-width=\"2.5\" opacity=\"1\"/><polygon points=\"432.0,270.0 468.0,270.0 461.0,258.0 439.0,258.0\" fill=\"#475569\"/><line x1=\"550.5\" y1=\"105.0\" x2=\"507.7\" y2=\"75.4\" stroke=\"#2563eb\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"497.9,68.6 511.5,70.0 504.0,80.8\" fill=\"#2563eb\" opacity=\"1\"/><line x1=\"550.5\" y1=\"105.0\" x2=\"498.5\" y2=\"105.0\" stroke=\"#0d9488\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"486.5,105.0 498.5,98.4 498.5,111.6\" fill=\"#0d9488\" opacity=\"1\"/><circle cx=\"550.5\" cy=\"105.0\" r=\"9\" fill=\"#f97316\" stroke=\"#fff\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"484.5\" y=\"53.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"700\" fill=\"#2563eb\">joint 1:<\/text><text x=\"484.5\" y=\"68.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"500\" fill=\"#2563eb\">this way<\/text><text x=\"478.5\" y=\"127.0\" font-size=\"12\" text-anchor=\"end\" font-weight=\"700\" fill=\"#0d9488\">joint 2: this way<\/text><text x=\"570.0\" y=\"268.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#0d9488\">two different directions,<\/text><text x=\"570.0\" y=\"284.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#0d9488\">so the tool can go anywhere<\/text><\/svg><figcaption>Arrows show how the tool moves when each joint turns a little.<\/figcaption><\/figure>\n<p>To see why, turn each joint a tiny bit and watch where the tool goes. (The table of these “tool moves per joint turn” is called the <b>Jacobian<\/b>; the book covers it in Chapter 5.) For 1° of joint motion:<\/p>\n<ul>\n<li><b>Stretched, pose (0°, 0°):<\/b> joint 1 moves the tool by (0, 0.061) and joint 2 by (0, 0.026). Both only go sideways (y). Nothing moves the tool along x.<\/li>\n<li><b>Bent, pose (30°, 60°):<\/b> joint 1 moves the tool by (−0.044, 0.030) and joint 2 by (−0.026, 0.000). Two different directions, so the tool can go anywhere nearby.<\/li>\n<\/ul>\n<p>One number sums it up: the <b>mobility score<\/b> L₁ L₂ sin θ₂ = 3.0 sin θ₂. It is 0 when θ₂ = 0° (stretched) or 180° (folded). It is best (3.0) at θ₂ = 90°. At θ₂ = 10° it is already down to 0.52.<\/p>\n{{viz:sing}}\n<p class=\"try\"><b>Try:<\/b> slide θ₂ toward 0° and watch the two arrows swing onto the same line.<\/p>\n<p><b>Why arms get stuck:<\/b> near a singularity a tiny tool move needs a big joint move, and exactly at one it needs an impossible one. Controllers then slow down, jerk or stop.<\/p>\n", "example": "Start fully stretched, tool at (3.50, 0). Pull the tool in by just 0.01, to (3.49, 0).\n<ul>\n<li>d = 3.49, so cos θ₂ = (3.49² − 4.00 − 2.25) / 6.0 = 0.9884.<\/li>\n<li>That gives θ₂ = 8.75° (and θ₁ = −3.75°).<\/li>\n<\/ul>\nA 0.01 move of the hand needs about 8.8° at the elbow. Far from the singularity the same move would need a fraction of a degree.", "remember": "Stretched or folded (θ₂ = 0° or 180°) is a singularity. Near it, small tool moves demand large joint moves.", "quiz": [{"q": "Which pose of the 2-link arm is a singularity?", "opts": ["θ₁ = 0°, θ₂ = 90°", "θ₁ = 90°, θ₂ = −90°", "θ₁ = 30°, θ₂ = 60°", "θ₁ = 45°, θ₂ = 0° (fully stretched)"], "a": 3, "why": "Only θ₂ decides it: the mobility score is L₁ L₂ sin θ₂, which is zero at θ₂ = 0°. θ₁ can be anything. The other three poses have θ₂ of 90°, −90° and 60°.", "step": null}, {"q": "The arm is fully stretched. Which tool motion is impossible?", "opts": ["Moving the tool farther out along the line of the arm.", "Moving the tool sideways, across the line of the arm.", "Turning joint 1 a little.", "Bending joint 2 a little."], "a": 0, "why": "A stretched arm is already at full reach, and both joints only move the tool sideways. Turning or bending is possible; it just cannot extend the reach.", "step": null}]}, {"id": "s7", "num": 7, "group": "ik", "label": "Numerical IK in one idea", "type": "learn", "big": "When the algebra is too hard, guess the angles, check how far off the tool is, nudge the angles to shrink that error, and repeat.", "picture": "Tuning a shower. Turn the tap a bit, feel the water, turn more or less. It goes faster if you know how much a quarter turn changes the temperature. That “how much per turn” tells you how big the next nudge should be.", "body": "\n<figure class=\"fig \"><svg class=\"fig-svg\" viewBox=\"0 0 640 258\" role=\"img\" aria-label=\"The numerical IK loop\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20.0\" y=\"16.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#2563eb\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"115.0\" y=\"42.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">1. Guess the angles<\/text><text x=\"115.0\" y=\"62.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">any starting guess<\/text><rect x=\"430.0\" y=\"16.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#0d9488\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"525.0\" y=\"42.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">2. Use FK<\/text><text x=\"525.0\" y=\"62.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">where is the tool now?<\/text><rect x=\"430.0\" y=\"182.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#c2410c\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"525.0\" y=\"208.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">3. Measure the error<\/text><text x=\"525.0\" y=\"228.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">target − tool position<\/text><rect x=\"20.0\" y=\"182.0\" width=\"190.0\" height=\"62.0\" rx=\"16\" fill=\"#fff\" stroke=\"#7e22ce\" stroke-width=\"2.5\" opacity=\"1\"/><text x=\"115.0\" y=\"208.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">4. Nudge the angles<\/text><text x=\"115.0\" y=\"228.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">so the error shrinks<\/text><line x1=\"216.0\" y1=\"47.0\" x2=\"413.0\" y2=\"47.0\" stroke=\"#8b96a8\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"424.0,47.0 413.0,53.0 413.0,41.0\" fill=\"#8b96a8\" opacity=\"1\"/><line x1=\"525.0\" y1=\"82.0\" x2=\"525.0\" y2=\"165.0\" stroke=\"#8b96a8\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"525.0,176.0 519.0,165.0 531.0,165.0\" fill=\"#8b96a8\" opacity=\"1\"/><line x1=\"424.0\" y1=\"213.0\" x2=\"227.0\" y2=\"213.0\" stroke=\"#8b96a8\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"216.0,213.0 227.0,206.9 227.0,219.1\" fill=\"#8b96a8\" opacity=\"1\"/><line x1=\"115.0\" y1=\"176.0\" x2=\"115.0\" y2=\"93.0\" stroke=\"#8b96a8\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\"1\"/><polygon points=\"115.0,82.0 121.0,93.0 109.0,93.0\" fill=\"#8b96a8\" opacity=\"1\"/><text x=\"320.0\" y=\"124.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">repeat until<\/text><text x=\"320.0\" y=\"144.0\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1b2330\">the error is tiny<\/text><text x=\"320.0\" y=\"164.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"500\" fill=\"#8b96a8\">(below 0.001)<\/text><\/svg><figcaption>The whole method is this loop.<\/figcaption><\/figure>\n<p>In words:<\/p>\n<ol>\n<li>Use FK to find where the tool is for the current angles.<\/li>\n<li><b>Error<\/b> = target − tool position.<\/li>\n<li>Use the “tool moves per joint turn” table from Step 6 to pick the nudge that cancels the error. The nudge must satisfy <i>table × nudge = error<\/i>.<\/li>\n<li>Add the nudge to the angles. Stop when the error is tiny (say below 0.001); otherwise go back to 1.<\/li>\n<\/ol>\n<p>The book calls this the Newton–Raphson method (Section 6.2). Try it yourself:<\/p>\n{{viz:nudge}}\n<p class=\"try\"><b>Try:<\/b> press Nudge a few times from Start A. Then press Start B and see which answer you land on.<\/p>\n<p>Three things to know: the <b>starting guess decides which solution you reach<\/b>; the method struggles near singularities; and if the target is out of reach the error never gets to zero.<\/p>\n", "example": "Target (1.5, 2.0), start (30°, 60°), tool at (1.732, 2.500).\n<p><b>First round.<\/b> Error = (−0.232, −0.500). Per radian, joint 1 moves the tool by (−2.50, 1.732) and joint 2 by (−1.5, 0.0). Solving for the nudge gives −16.5° for joint 1 and +36.4° for joint 2.<\/p>\n<table class=\"tbl\"><thead><tr><th>Round<\/th><th>Angles<\/th><th>Tool<\/th><th>Error<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>30.00°, 60.00°<\/td><td>(1.732, 2.500)<\/td><td>0.5512<\/td><\/tr><tr><td>1<\/td><td>13.46°, 96.43°<\/td><td>(1.435, 1.876)<\/td><td>0.1401<\/td><\/tr><tr><td>2<\/td><td>16.18°, 90.16°<\/td><td>(1.499, 1.997)<\/td><td>0.0035<\/td><\/tr><tr><td>3<\/td><td>16.26°, 90.00°<\/td><td>(1.500, 2.000)<\/td><td>0.0000<\/td><\/tr><\/tbody><\/table>\n<p>Three rounds and the error is below 0.001. The answer is the elbow-down solution. Starting at (45°, −30°) instead:<\/p>\n<table class=\"tbl\"><thead><tr><th>Round<\/th><th>Angles<\/th><th>Tool<\/th><th>Error<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>45.00°, −30.00°<\/td><td>(2.863, 1.802)<\/td><td>1.3773<\/td><\/tr><tr><td>1<\/td><td>117.51°, −165.47°<\/td><td>(0.081, 0.660)<\/td><td>1.9521<\/td><\/tr><tr><td>2<\/td><td>122.64°, −89.44°<\/td><td>(0.176, 2.506)<\/td><td>1.4168<\/td><\/tr><tr><td>3<\/td><td>98.84°, −109.17°<\/td><td>(1.168, 1.707)<\/td><td>0.4424<\/td><\/tr><tr><td>4<\/td><td>90.54°, −91.23°<\/td><td>(1.481, 1.982)<\/td><td>0.0262<\/td><\/tr><tr><td>5<\/td><td>90.00°, −90.01°<\/td><td>(1.500, 2.000)<\/td><td>0.0001<\/td><\/tr><tr><td>6<\/td><td>90.00°, −90.00°<\/td><td>(1.500, 2.000)<\/td><td>0.0000<\/td><\/tr><\/tbody><\/table>\n<p>It needs more rounds and lands on the elbow-up solution (90°, −90°).<\/p>", "remember": "Numerical IK = guess, measure error, nudge, repeat. Where you start decides which answer you get.", "quiz": [{"q": "What is the core loop of numerical IK?", "opts": ["Solve a triangle with the law of cosines once.", "Try random angles until one works.", "Compute the error, nudge the angles to reduce it, and repeat until the error is small.", "Invert the FK formula symbolically."], "a": 2, "why": "Numerical IK improves a guess step by step. The law of cosines is the closed-form method of Step 5.", "step": null}, {"q": "Starting from (30°, 60°) the method finds the elbow-down answer. Starting from (45°, −30°) it finds the elbow-up one. What does that show?", "opts": ["The starting guess can decide which solution you get.", "Numerical IK always prefers elbow up.", "The target moved between the two runs.", "One of the two runs must be wrong."], "a": 0, "why": "With several valid solutions, the loop slides into whichever one is closest to where it started. Both answers are correct.", "step": null}]}, {"id": "s8", "num": 8, "group": "extra", "label": "Practice", "type": "practice", "big": "Twelve mixed questions. Answer each one and a short worked solution appears.", "quiz": [{"q": "FK: }

/* ------------------------------------------------------------------ learn content */
function vizHtml(s) { return s.replace(/\{\{viz:(\w+)\}\}/g, '<div class="viz" data-viz="$1"></div>'); }
function stepHead(s) {
  return `<div class="stephead" style="--c:${gcolor(s.group)}"><div class="badge">${s.num}</div><div><div class="kicker">Step ${s.num} of ${D.steps.length}</div><h2>${s.label}</h2></div></div>`;
}
function learnHtml(s) {
  return stepHead(s) +
    `<div class="big">${s.big}</div>` +
    `<div class="pic"><b class="lbl">Picture it</b>${s.picture}</div>` +
    vizHtml(s.body) +
    `<div class="ex"><b class="lbl">Worked example</b>${s.example}</div>` + (s.after || "") +
    `<div class="rem"><span>★</span>${s.remember}</div>`;
}

/* ------------------------------------------------------------------ quiz engine */
function qBlock(s, q, i, st) {
  // interactive question card
  const d = el("div", "q"); d.style.setProperty("--c", gcolor(s.group));
  const ref = stepById(q.step || s.id);
  d.innerHTML = `<p class="qt"><span class="qnum">${i + 1}.</span> ${q.q}</p>`;
  const ul = el("div", "opts");
  q.opts.forEach((o, k) => { const b = el("button", "opt", `<span class="ltr">${LET[k]}</span><span>${o}</span>`); b.type = "button"; b.dataset.k = k; ul.append(b); });
  const fb = el("div", "fb"); fb.setAttribute("role", "status");
  d.append(ul, fb);
  const apply = (k, quiet) => {
    ul.querySelectorAll(".opt").forEach(b => { b.disabled = true; const kk = +b.dataset.k; if (kk === q.a) b.classList.add("right"); else if (kk === k) b.classList.add("wrong"); });
    const good = k === q.a, lab = s.type === "learn" ? "Explanation" : "Worked answer";
    fb.className = "fb show " + (good ? "ok" : "no");
    fb.innerHTML = `<b>${good ? "Correct." : "Not quite."} The answer is ${LET[q.a]}.</b>${lab}: ${q.why}` +
      (!good && s.type !== "learn" ? ` <a href="#${ref.id}">Review step ${ref.num}</a>` : "") + (!good && s.type === "learn" ? ` <a href="#${s.id}">Review the step</a>` : "");
  };
  const a = answers(s)[i]; if (a !== null) apply(a, true);
  ul.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    answers(s)[i] = +b.dataset.k; save(); apply(+b.dataset.k); st.update();
  });
  return d;
}
function quizHtml(s, host) {
  const wrap = el("div", "quiz"); wrap.style.setProperty("--c", gcolor(s.group));
  const sc = el("div", "score"); const res = el("div", "results"); res.hidden = true;
  const st = {
    update() {
      const n = answers(s).filter(a => a !== null).length, tot = s.quiz.length;
      sc.innerHTML = n < tot ? `<span>Answered ${n} of ${tot}</span><span>Score so far: ${score(s)}</span>` : `<span><b>Score: ${score(s)} / ${tot}</b></span><span>${score(s) === tot ? "All correct" : "Review the links above"}</span>`;
      if (n === tot) {
        const miss = s.quiz.map((q, i) => [q, i]).filter(([q, i]) => answers(s)[i] !== q.a);
        if (s.type !== "learn") {
          res.hidden = false;
          res.innerHTML = miss.length ? `<b>To review</b><ul>${miss.map(([q, i]) => { const r = stepById(q.step); return `<li>Question ${i + 1}: <a href="#${r.id}">Step ${r.num}, ${r.label}</a></li>`; }).join("")}</ul>` : `<b>Nothing to review. Every question was right.</b>`;
        }
        renderMap();
      }
      save();
    }
  };
  s.quiz.forEach((q, i) => wrap.append(qBlock(s, q, i, st)));
  wrap.append(sc, res); st.update();
  return wrap;
}

/* ------------------------------------------------------------------ map */
function renderMap() {
  const map = $("#map"); map.innerHTML = "";
  D.groups.forEach((g, gi) => {
    const ss = D.steps.filter(s => s.group === g.id); if (!ss.length) return;
    if (map.children.length) map.append(el("i", "gcon"));
    const grp = el("div", "grp"); grp.style.setProperty("--c", g.color);
    grp.append(el("div", "glabel", g.label));
    const nodes = el("div", "nodes");
    ss.forEach((s, k) => {
      if (k) nodes.append(el("i", "con"));
      const b = el("button", "node"); b.type = "button"; b.style.setProperty("--c", g.color);
      const here = pages[cur].id === s.id;
      if (here) b.classList.add("cur"); if (isDone(s)) b.classList.add("done");
      const learnOn = !!state.seen[s.id], quizOn = isDone(s);
      b.innerHTML = `<span class="badge">${s.num}<span class="tick">✓</span></span><span class="nlabel">${s.label}</span><span class="dots">${s.type === "learn" ? `<i class="${learnOn ? "on" : ""}"></i>` : ""}<i class="${quizOn ? "on" : ""}"></i></span>`;
      b.setAttribute("aria-label", `Step ${s.num}: ${s.label}${isDone(s) ? ", done" : ""}`);
      if (here) b.setAttribute("aria-current", "step");
      b.onclick = () => go(pages.findIndex(p => p.id === s.id));
      nodes.append(b);
    });
    grp.append(nodes); map.append(grp);
  });
  const done = D.steps.filter(isDone).length;
  $("#progbar").style.width = (100 * done / D.steps.length) + "%";
  $("#proglabel").textContent = `${done} of ${D.steps.length} steps done`;
  const c = map.querySelector(".node.cur"); if (c && c.scrollIntoView) { const sc = $(".mapscroll"); sc.scrollLeft = c.offsetLeft - sc.clientWidth / 2 + c.offsetWidth / 2; }
}

/* ------------------------------------------------------------------ interactive render */
function render() {
  cur = pageFromHash(); const p = pages[cur], s = stepById(p.id); const stage = $("#stage"); stage.innerHTML = "";
  const card = el("section", "card step-" + s.id); card.style.setProperty("--c", gcolor(s.group)); stage.append(card);
  if (p.screen === "learn") { card.innerHTML = learnHtml(s); mountViz(card); state.seen[s.id] = 1; save(); }
  else if (p.screen === "quiz") {
    card.innerHTML = stepHead(s).replace(/<h2>.*?<\/h2>/, `<h2>${s.label}: quiz</h2>`) + `<p class="small">Two questions. Answer in any order; you can move on at any time.</p>`;
    card.append(quizHtml(s));
  } else {
    card.innerHTML = stepHead(s) + `<div class="big">${s.big}</div>`; card.append(quizHtml(s));
  }
  renderMap();
  $("#back").disabled = cur === 0; const nx = pages[cur + 1];
  $("#next").disabled = !nx; $("#next").textContent = !nx ? "Done" : (nx.screen === "quiz" ? "Quiz" : "Next");
  $("#where").textContent = `Step ${s.num} · ${p.screen === "learn" ? "Learn" : p.screen === "quiz" ? "Quiz" : s.label}`;
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------ print render */
function printRender() {
  document.body.classList.add("print");
  const stage = $("#stage"); stage.innerHTML = "";
  D.steps.forEach(s => {
    const sec = el("section", "card pstep" + (s.type !== "learn" ? " pb" : "")); sec.style.setProperty("--c", gcolor(s.group));
    if (s.type === "learn") { sec.innerHTML = learnHtml(s); mountViz(sec); }
    else sec.innerHTML = stepHead(s) + `<div class="big">${s.big}</div>`;
    const h = el("h3", "", s.type === "learn" ? "Quiz" : "Questions"); sec.append(h);
    s.quiz.forEach((q, i) => {
      const d = el("div", "q"); d.innerHTML = `<p class="qt"><b>${i + 1}.</b> ${q.q}</p><ol class="opts pl">${q.opts.map((o, k) => `<li><span class="ltr">${LET[k]}.</span><span>${o}</span></li>`).join("")}</ol>`;
      sec.append(d);
    });
    stage.append(sec);
  });
  if (ANSWERS) {
    const sec = el("section", "card pstep pb key"); sec.innerHTML = `<h2>Instructor answer key</h2><p class="small">Answers and the explanation to give for each question.</p>`;
    D.steps.forEach(s => {
      sec.append(el("h3", "", `Step ${s.num}: ${s.label}`));
      s.quiz.forEach((q, i) => sec.append(el("p", "", `<b>${i + 1}. ${LET[q.a]}.</b> ${q.why}`)));
    });
    stage.append(sec);
  }
}

/* ------------------------------------------------------------------ boot */
$("#title").textContent = D.title; $("#lede").textContent = D.lede; document.title = D.title;
$("#foot").innerHTML = `<p><b>${D.footer}</b></p><h2>References</h2><ul>${D.refs.map(r => `<li>${r}</li>`).join("")}</ul>`;
if (PRINT) { printRender(); }
else {
  window.addEventListener("hashchange", render);
  $("#back").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1);
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.tagName === "CANVAS")) return;
    if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
  });
  render();
}
window.__guide = { D, pages, go, state, get cur() { return cur; }, answers, score, isDone };
</script>
</body>
</html>
